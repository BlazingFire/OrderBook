# Setup files for the Office Panel, on Windows, macOS and Linux — one
# `tools/release.mjs` run per OS, on that OS (`assertTarget()`). What each OS
# makes, and why, is said at its block below; every file configured here is
# one `release.mjs` publishes, which `master/tests/packaging-invariants.test.ts`
# holds it to.
#
# The shape that matters: the panel's server ships as **real files** under
# `resources/panel`, not inside the asar. The server is spawned as its own Node
# process and reads fonts, the built web bundle and (on the Master) 100 MB of
# PostgreSQL binaries from disk — none of which works from inside an archive.
# Only the small Electron shell goes in the asar.
#
# Nothing here writes to the data directory. That lives under the user's
# application-data folder (`%APPDATA%\OrderBook` on Windows,
# `~/Library/Application Support/OrderBook` on macOS, `~/.config/OrderBook` on
# Linux), put there by the shell before the server starts, precisely so an
# upgrade or an uninstall cannot touch a company's parties, leads and orders.
appId: com.orderbook.office
productName: OrderBook Office Panel
copyright: OrderBook

directories:
  output: ../build/office
  # `build/` is gitignored repo-wide, so the NSIS hook would never be committed.
  buildResources: installer

# Nothing here has native modules to rebuild, and the panel's own dependencies
# ship as staged files rather than as an app `node_modules`. Both flags are off
# because electron-builder otherwise runs `npm install --omit=dev` against this
# workspace — which strips the repo's dev dependencies and breaks the next
# `npm run build` on the developer's own machine. It did exactly that once.
npmRebuild: false
# Switches off the fuses that let NODE_OPTIONS or --inspect steer the program (1.4 R8;
# `tools/flip-fuses.cjs` says why). The `RunAsNode` fuse stays on: the server is started with it.
afterPack: ../tools/flip-fuses.cjs
buildDependenciesFromSource: false

files:
  - electron/dist/**/*
  - package.json
  # electron-builder adds the app's production `node_modules` to the asar
  # whatever `files` says, and resolves them through the hoisted workspace
  # root — which put a second, never-loaded copy of the whole panel runtime
  # (PostgreSQL binaries included, on the Master) inside `app.asar` beside the
  # staged one under `resources/panel`. The shell imports nothing from
  # `node_modules`, so none of it belongs in the archive.
  - '!**/node_modules/**/*'

extraResources:
  - from: staging
    to: panel
  # The uninstall scripts ship as real files, beside the panel rather than in
  # the asar, because neither thing that runs them can read out of an archive:
  # the shell hands the script to powershell.exe/bash after it has quit, and the
  # NSIS uninstaller copies it out to sweep leftovers once the program folder is
  # already gone.
  #
  # `from` is outside this panel directory on purpose, and that is supported:
  # app-builder-lib resolves it with `path.resolve(projectDir, from)`
  # (out/fileMatcher.js, getFileMatchers), so `..` reaches the repository root.
  # One copy of the scripts, shipped by both panels.
  - from: ../tools/uninstall
    to: uninstall

# One 1024px PNG per panel, rendered by `node tools/make-icons.mjs` from the
# logo lattice; electron-builder derives the .ico and .icns from it.
icon: installer/icon.png

win:
  # Its own multi-size .ico (16 to 256 px, `tools/make-icons.mjs`): electron-builder's
  # conversion of icon.png gives one 256 px image, a blur at taskbar size. The afterPack
  # hook stamps it into the .exe (`tools/exe-icon.cjs`); NSIS uses it for the setup files.
  icon: installer/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Unsigned. Windows SmartScreen will warn until a certificate is bought and
  # the build is signed with it — a purchase, not a code change.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: true
  # The new version opens by itself when an install ends (1.4 R7d): in the
  # wizard this is the "Run" box on the finish page, ticked; in a silent install
  # (the update button, the Master's nightly update) it is `--force-run`, which
  # the shell passes (`electron/lib/update-launch.ts`).
  runAfterFinish: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Never delete the data directory. An uninstall removes the program; the
  # company's records are not the program's to take with it.
  deleteAppDataOnUninstall: false
  include: installer/installer.nsh
  artifactName: OrderBook-Office-${version}-Setup.${ext}

# Linux. One artefact, the AppImage: the setup file the manifest names and what
# somebody runs off a USB stick with nothing installed. There is no .deb (1.4.1:
# it was only ever published beside the setup file, which is no longer done).
#
# x64 only, and `TARGETS.linux.arch` says the same. This panel stages nothing
# native, so an arm64 machine builds these x64 files as well as any other; it
# is the Master's release that `assertHostArch()` in `tools/release.mjs`
# refuses off x64, because it would carry that machine's `sharp` and
# PostgreSQL.
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
  # Without this the binary is named from the npm package and ships as
  # `@orderbookoffice` — an at-sign and no product name, which the uninstall
  # script's path and process matching would not recognise.
  executableName: orderbook-office
  synopsis: OrderBook Office Panel — creates leads and orders against the Master
  # electron-builder reads the publish configuration while naming update
  # channels for the AppImage and dies in `computeChannelNames` on a null
  # provider. Nothing here publishes through electron-builder — `publish()` in
  # tools/release.mjs writes the releases folder itself — so saying so outright
  # is both true and what keeps the build alive.
  publish: null
  # electron-builder's Linux packaging wants a homepage and a maintainer, and reads
  # both from package.json, which has neither — this is a private monorepo, not
  # a published npm package. Declaring them here keeps that true.
  #
  # `.local` is deliberate rather than a placeholder: this product never reaches
  # the internet at runtime, and a real-looking address on a package nobody can
  # write to would be worse than an obviously internal one.
  maintainer: OrderBook <releases@orderbook.local>
  artifactName: OrderBook-Office-${version}-Setup.${ext}

# macOS. Built only on a Mac — electron-builder refuses the target anywhere
# else, so the Windows workflow is unaffected. `npm run release` defaults to the
# host platform and takes `--os mac` to be explicit. One artefact, the .dmg: it
# is what a person installs from and what the update path hands the shell,
# which opens (mounts) it with `shell.openPath` in `electron/shell.ts` —
# `installerExtension()` in `electron/lib/installer.ts` is what lets a .dmg
# through on macOS.
# No .zip: that target exists for electron-updater's Squirrel.Mac path, which
# nothing here uses, and building it cost the mac leg a second universal
# archive that was never published.
mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: [universal]
  # Hardened runtime is required for notarisation; the entitlements let the
  # Electron renderer JIT and let the vendored PostgreSQL binaries, signed with
  # the same identity, load their own dylibs.
  # Everything under Resources/panel is staged once and copied into both
  # halves of the universal merge, so its Mach-O files (the vendored
  # PostgreSQL of both architectures, both `sharp` binaries) are identical in
  # each half and are not to be lipo'd — @electron/universal refuses an
  # identical Mach-O file unless it matches this pattern. The Electron binaries
  # themselves differ per half and are still merged.
  x64ArchFiles: Contents/Resources/panel/**
  # As under `linux:` — `npm run release` makes electron-builder's publish
  # policy "always", and with a GitHub token in the environment it would try
  # to publish the .dmg itself. `publish()` in tools/release.mjs owns that.
  publish: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: installer/entitlements.mac.plist
  entitlementsInherit: installer/entitlements.mac.plist
  # An identity is picked up from the keychain when one is present; without
  # one electron-builder 25 skips signing altogether (it has no ad-hoc
  # fallback), so hardenedRuntime and the entitlements only take effect once
  # an identity exists, and a downloaded copy needs a right-click Open. Notarisation needs APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID in the environment — an
  # account and a purchase, not a code change.
  notarize: false
  extendInfo:
    # macOS 14+ asks before an app may talk to the local network. Without this
    # string the prompt has no explanation and LAN discovery silently fails.
    NSLocalNetworkUsageDescription: OrderBook finds and talks to the other OrderBook panels on this network.
  artifactName: OrderBook-Office-${version}-Setup.${ext}

dmg:
  # Drag-to-Applications layout; the defaults put the two icons on top of each other.
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
