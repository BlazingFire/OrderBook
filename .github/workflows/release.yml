name: Release

# Push a version bump to main and the fleet updates itself.
#
# The trigger is deliberately a *version change*, not any push to main: a
# README fix should not rebuild 200 MB of installers and offer every shop PC an
# update that is byte-for-byte what it is already running. So this builds only
# when `package.json`'s version names a tag that does not exist yet — which
# makes `npm version` (or editing that one field) the publish gesture.
#
#   1. Bump the version and push to main.
#   2. This builds both panels on all three operating systems and the Windows 7
#      Office build on a fourth leg, signs each manifest, and publishes one
#      GitHub Release holding the setup files and the manifests, nothing else
#      (no standalone `.exe`, no `.deb`, no `.sha256`).
#   3. Each Master polls that release, verifies the signature, downloads into
#      its releases folder, and serves the office build to its panels over the
#      LAN exactly as it does for a USB stick today.
#
# ## Building without publishing
#
# Run the workflow by hand (Actions → Release → Run workflow) on any branch
# and it builds every file and attaches them to a **draft pre-release** named
# after the branch and commit — a way to get the files for a branch, or to
# prove a build still works, without tagging anything or touching what the
# fleet sees: `latestRelease()` ignores drafts and pre-releases alike. Tick
# "publish" to create the real release instead — from main only: the `check`
# job refuses it on any other branch or tag, warns, and builds the draft
# pre-release. Draft builds are the maintainers' to delete once downloaded.
#
# ## Why a matrix
#
# electron-builder does not cross-compile: a .dmg is made with `hdiutil` and an
# AppImage with Linux tooling, and `assertTarget()` in `tools/release.mjs`
# refuses the attempt before an hour of staging rather than after. So each OS
# builds on its own runner, and `manifestAsset()` in
# `master/src/services/github-releases.ts` is what lets one release hold all
# three: `latest-<panel>.json` is Windows (the name already in the field) and
# `latest-<panel>-<platform>.json` is everything else.
#
# ## Where releases are published
#
# `master/src/services/github-releases.ts` explains why the assets should live
# in their own **public** repository: assets on a private repository need an
# `Authorization` header, and shipping a token that can read them ships a
# credential that can generally read the source. Releases go to the public
# repository `BlazingFire/OrderBook-Releases` (1.4), which is also the default
# every Master fetches from (`DEFAULT_RELEASES_REPO` in
# `shared/src/domain/release-keys.ts`). Set the `RELEASES_TOKEN` secret to a
# token with `contents: write` on it; set the `RELEASES_REPO` variable only to
# publish somewhere else.
#
# ## Signing
#
# `RELEASE_KEY` holds the private PEM from `npm run release:keygen`. Without it
# the release is still built but published as a **draft**, and
# `latestRelease()` ignores drafts — so an unsigned build cannot reach a single
# machine by accident. That is the fail-safe: no key, no fleet update.
#
# Note the tradeoff the keygen script warns about — a key in Actions secrets
# can be used by anybody who can push a workflow file here. For a private
# repository with one owner that is the same person; for anything wider, drop
# the secret and sign on the release machine instead.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the real GitHub Release (main only). Off: a draft pre-release build for this branch.'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Split out so exactly one runner decides, and exactly one creates the
  # release. Three matrix legs each running `gh release create` would race, and
  # two of them would fail on a tag that already exists.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      signed: ${{ steps.version.outputs.signed }}

    steps:
      - uses: actions/checkout@v4

      - name: Decide what this run does
        id: version
        env:
          # The same repository and token `create-release` and the upload use:
          # with a separate releases repository configured, looking for the tag
          # here would never find it and every push would try to publish again.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          REPO: ${{ vars.RELEASES_REPO || 'BlazingFire/OrderBook-Releases' }}
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          EVENT: ${{ github.event_name }}
          WANT_PUBLISH: ${{ inputs.publish }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          released=false
          if gh release view "v$version" --repo "$REPO" >/dev/null 2>&1; then
            released=true
          fi

          # `build`: make the files at all. `publish`: create the real release
          # for v<version>. Neither, both, or build-only into a draft.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            build=true
            publish=false
            if [ "$WANT_PUBLISH" = "true" ]; then
              if [ "$released" = "true" ]; then
                echo "::warning::v$version is already released — building a draft instead."
              else
                publish=true
              fi
            fi
          elif [ "$released" = "true" ]; then
            echo "v$version is already released — nothing to do."
            build=false
            publish=false
          else
            build=true
            publish=true
          fi

          # Only main publishes. The push trigger already says so, but a hand-run
          # can be started on any branch or tag, and ticking "publish" there
          # used to create the real v<version> from that commit — the release
          # every Master polling this repository would then offer its shop.
          # `GITHUB_REF` is the runner's own, not an input anybody types.
          if [ "$publish" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::warning::Only main publishes a release, and this run is on $GITHUB_REF — building a draft pre-release instead."
            publish=false
          fi

          if [ "$publish" = "true" ]; then
            tag="v$version"
          else
            tag="build-$version-$(git rev-parse --short "$GITHUB_SHA")"
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # The same secret reaches every runner, so this is decided once.
          if [ -z "$RELEASE_KEY" ]; then
            echo "No RELEASE_KEY secret — this build will publish as an unsigned DRAFT."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

  # Created empty and up front, so each matrix leg has somewhere to upload to
  # the moment it finishes rather than waiting for the slowest OS.
  create-release:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          REPO: ${{ vars.RELEASES_REPO || 'BlazingFire/OrderBook-Releases' }}
          # Through the environment, never pasted into the script: a commit
          # message containing a quote or `$(…)` would otherwise break out of
          # the argument and run as shell.
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          version='${{ needs.check.outputs.version }}'
          tag='${{ needs.check.outputs.tag }}'

          if [ '${{ needs.check.outputs.publish }}' != 'true' ]; then
            # A build, not a release: a draft *and* a pre-release under a tag
            # of its own, so that even if somebody publishes it by mistake,
            # `/releases/latest` — which skips pre-releases — never names it.
            sha="$(echo "$GITHUB_SHA" | cut -c1-7)"
            gh release create "$tag" \
              --repo "$REPO" \
              --target "$GITHUB_SHA" \
              --title "Build $version from $GITHUB_REF_NAME @ $sha (not a release)" \
              --notes "Built by hand from $GITHUB_REF_NAME at $GITHUB_SHA. Not published to any panel; delete once downloaded." \
              --draft --prerelease
            echo "::notice::Building $version as draft pre-release $tag on $REPO."
            exit 0
          fi

          # Unsigned stays a draft. `latestRelease()` skips drafts and
          # pre-releases, so nothing here reaches a shop PC until a human
          # publishes it deliberately.
          draft=''
          if [ '${{ needs.check.outputs.signed }}' != 'true' ]; then
            draft='--draft'
            echo "::warning::Published as a draft: no RELEASE_KEY, so the manifests are unsigned."
          fi

          # `--target`: the tag points at the commit that was built, not at
          # whatever the default branch's tip is by the time this runs.
          gh release create "$tag" \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "OrderBook $version" \
            --notes "$NOTES" \
            $draft

  build:
    needs: [check, create-release]
    if: needs.check.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}

    strategy:
      # One red OS should not cancel two builds that are working. The failing
      # leg stays red and the release simply has no asset for that platform,
      # which is visible in its asset list and in `manifestAsset()`'s 404.
      fail-fast: false
      matrix:
        include:
          - os: win
            runner: windows-latest
          - os: mac
            runner: macos-latest
          - os: linux
            runner: ubuntu-latest
          # The Windows 7 Office build (docs/WINDOWS7.md): the Office only, on
          # Electron 22, for x64 and ia32. Its manifest is `latest-win7.json`,
          # which the collect step below uploads as `latest-office-win7.json`.
          - os: win7
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # No `install-scripts approve` step: the runner's npm 10 does not block
        # postinstall the way npm 12 does locally, so `@embedded-postgres`'s
        # `hydrate-symlinks.js` — which recreates the SONAME symlinks the
        # server needs to load its own libraries on macOS and Linux — runs as
        # part of `npm ci`.
        run: npm ci

      - name: Write the release key
        id: key
        shell: bash
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo "key_file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Outside the workspace, so no later step can package it by accident.
          key_file="$RUNNER_TEMP/release.pem"
          printf '%s' "$RELEASE_KEY" > "$key_file"
          echo "::add-mask::$key_file"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"

      - name: Build and sign both installers
        shell: bash
        env:
          ORDERBOOK_RELEASES_DIR: ${{ runner.temp }}/release-out
          ORDERBOOK_RELEASE_KEY: ${{ steps.key.outputs.key_file }}
          ORDERBOOK_RELEASE_KEY_ID: ${{ vars.RELEASE_KEY_ID }}
          ORDERBOOK_RELEASE_NOTES: ${{ github.event.head_commit.message }}
        # `--os` is passed rather than left to the host so a runner image change
        # cannot silently build something other than what this leg is named for.
        run: npm run release -- --os ${{ matrix.os }}

      - name: Collect this platform's assets
        shell: bash
        run: |
          # A GitHub Release has one namespace for every asset, so each
          # `latest-<platform>.json` is renamed to the name `manifestAsset()`
          # in `github-releases.ts` will ask for. The Windows shim keeps the
          # bare `latest-<panel>.json` name every panel in the field knows.
          out='${{ runner.temp }}/release-out'
          upload="$RUNNER_TEMP/upload"
          mkdir -p "$upload"

          shopt -s nullglob
          for dir in "$out"/*-panel; do
            panel="$(basename "$dir")"
            panel="${panel%-panel}"

            for manifest in "$dir"/latest-*.json; do
              platform="$(basename "$manifest" .json)"
              platform="${platform#latest-}"
              cp "$manifest" "$upload/latest-$panel-$platform.json"
            done

            # The compatibility shim, written only by a Windows build.
            if [ -f "$dir/latest.json" ]; then
              cp "$dir/latest.json" "$upload/latest-$panel.json"
            fi

            # The setup file `tools/release.mjs` published for this platform
            # (.exe, .dmg or .AppImage) and nothing else. The manifests above
            # name it; there is no standalone file or checksum file to upload.
            for setup in "$dir"/OrderBook-*-Setup.*; do
              cp "$setup" "$upload/"
            done
          done

          echo "Uploading:"
          ls -1 "$upload"

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          REPO: ${{ vars.RELEASES_REPO || 'BlazingFire/OrderBook-Releases' }}
        run: |
          tag='${{ needs.check.outputs.tag }}'
          # --clobber so a re-run of one leg replaces its own assets instead of
          # failing on names the previous attempt already uploaded.
          gh release upload "$tag" "$RUNNER_TEMP/upload"/* \
            --repo "$REPO" --clobber
