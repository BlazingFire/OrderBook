name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The integration suites drive a real PostgreSQL cluster themselves
      # (initdb + pg_ctl), so the binaries need to be present but no service
      # has to be running.
      - name: Install PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          echo "ORDERBOOK_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - name: Build both panels
        run: npm run build
